<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小龙瘦身大作战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #1a2a3a 0%, #0f1720 100%);
    color: #eef4f8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%; overflow-y: auto; user-select: none; padding: 20px;
  }
  .hidden { display: none !important; }

  h1 { font-size: 22px; font-weight: 500; opacity: .8; margin-bottom: 30px; letter-spacing: 3px; }
  h2 { font-size: 24px; font-weight: 600; margin-bottom: 22px; letter-spacing: 2px; }

  /* ===== 主菜单 ===== */
  #menu { display: flex; flex-direction: column; align-items: center; }
  .menu-list { display: flex; flex-direction: column; gap: 12px; width: 260px; }
  .menu-item {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 22px; border-radius: 16px; border: none;
    background: #22303d; color: #eef4f8; font-size: 20px; cursor: pointer;
    transition: background .15s;
  }
  .menu-item:active { background: #2f4353; }
  .menu-item .emoji { font-size: 26px; }
  .menu-item.highlight { background: #2b8a9e; }
  .menu-item.highlight:active { background: #339cb2; }

  /* ===== 设置页 ===== */
  #setup, #active { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 380px; }
  .fields { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; width: 100%; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 17px; }
  .field > label { opacity: .85; }
  .section-label { font-size: 14px; opacity: .55; margin: 8px 0 -2px; letter-spacing: 1px; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button {
    width: 40px; height: 40px; border-radius: 10px; border: none;
    background: #2b3b4a; color: #eef4f8; font-size: 24px; cursor: pointer;
  }
  .stepper button:active { background: #3a5164; }
  .stepper input {
    width: 60px; height: 40px; text-align: center; font-size: 19px;
    border-radius: 10px; border: 1px solid #3a5164; background: #131f29; color: #eef4f8;
    font-variant-numeric: tabular-nums;
  }
  .stepper .unit { opacity: .6; font-size: 15px; width: 18px; }

  /* 组合训练:可排序的动作行 */
  .ex-row {
    display: flex; align-items: center; gap: 10px;
    background: #1b2733; border-radius: 12px; padding: 8px 10px;
  }
  .ex-order { display: flex; flex-direction: column; gap: 3px; }
  .ex-order button {
    width: 30px; height: 20px; border: none; border-radius: 6px;
    background: #2b3b4a; color: #cfe3ee; font-size: 12px; line-height: 1; cursor: pointer;
  }
  .ex-order button:disabled { opacity: .3; cursor: default; }
  .ex-order button:active:not(:disabled) { background: #3a5164; }
  .ex-name { flex: 1; font-size: 17px; }
  .ex-idx { opacity: .5; font-size: 14px; width: 20px; text-align: center; }

  /* ===== 运行页 ===== */
  .stage {
    position: relative; width: 300px; height: 300px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 30px;
  }
  .circle {
    position: absolute; width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4fd1c5, #2b8a9e 60%, #1f6172);
    box-shadow: 0 0 60px rgba(79,209,197,.35);
    transform: scale(0.7); transition: transform linear;
  }
  .circle.rest {
    background: radial-gradient(circle at 35% 30%, #f0b86e, #c98a3c 60%, #a06d28);
    box-shadow: 0 0 60px rgba(240,184,110,.3);
  }
  .center-text { position: relative; z-index: 2; text-align: center; pointer-events: none; }
  .action { font-size: 32px; font-weight: 700; letter-spacing: 3px; }
  .count  { font-size: 58px; font-weight: 300; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .progress { font-size: 15px; opacity: .7; height: 20px; margin-bottom: 10px; text-align: center; }

  /* ===== 按钮 ===== */
  .btn-main {
    padding: 14px 50px; font-size: 20px; border: none; border-radius: 40px;
    background: #4fd1c5; color: #08222a; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 20px rgba(79,209,197,.35); letter-spacing: 2px; margin: 6px 0;
  }
  .btn-main:active { transform: translateY(1px); }
  .btn-stop { background: #e07a7a; box-shadow: 0 6px 20px rgba(224,122,122,.35); }
  .btn-secondary { background: #33475a; color: #eef4f8; box-shadow: none; }
  .btn-back {
    align-self: flex-start; background: none; border: none; color: #8fb3c8;
    font-size: 16px; cursor: pointer; margin-bottom: 10px;
  }
  .controls { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

  <!-- ===== 主菜单 ===== -->
  <div id="menu">
    <h1>小龙瘦身大作战</h1>
    <div class="menu-list" id="menuList"></div>
  </div>

  <!-- ===== 设置页 ===== -->
  <div id="setup" class="hidden">
    <button class="btn-back" id="setupBack">‹ 返回</button>
    <h2 id="setupTitle"></h2>
    <div class="fields" id="fields"></div>
    <button class="btn-main" id="startBtn">开始</button>
  </div>

  <!-- ===== 运行页 ===== -->
  <div id="active" class="hidden">
    <div class="progress" id="progress"></div>
    <div class="stage">
      <div class="circle" id="circle"></div>
      <div class="center-text">
        <div class="action" id="action"></div>
        <div class="count" id="count"></div>
      </div>
    </div>
    <div class="controls" id="activeControls">
      <button class="btn-main hidden" id="doneBtn">完成</button>
      <button class="btn-main btn-stop" id="stopBtn">停止</button>
    </div>
    <div class="controls hidden" id="finishControls">
      <button class="btn-main" id="againBtn">再来一次</button>
      <button class="btn-main btn-secondary" id="menuBtn">返回菜单</button>
    </div>
  </div>

<script>
  // ===== 训练定义 =====
  const EXERCISES = {
    circuit:   { name: '组合训练', type: 'circuit',   emoji: '🏋️', highlight: true },
    breathing: { name: '呼吸训练', type: 'breathing', emoji: '🫁' },
    plank:     { name: '平板支撑', type: 'time',      emoji: '🧘' },
    pushup:    { name: '俯卧撑',   type: 'count',     emoji: '💪' },
    situp:     { name: '仰卧起坐', type: 'count',     emoji: '🔥' },
    squat:     { name: '深蹲',     type: 'count',     emoji: '🦵' },
  };

  // 单项训练的可设置项
  const FIELDS = {
    breathing: [
      { id: 'reps',     label: '每组次数', def: 5, min: 1, max: 99 },
      { id: 'sets',     label: '组数',    def: 3, min: 1, max: 20 },
      { id: 'contract', label: '收缩(秒)', def: 5, min: 1, max: 60 },
      { id: 'release',  label: '放开(秒)', def: 5, min: 1, max: 60 },
      { id: 'rest',     label: '组间休息(秒)', def: 30, min: 0, max: 600 },
    ],
    plank:  [ { id: 'duration', label: '时长(秒)', def: 60, min: 5, max: 600 } ],
    pushup: [ { id: 'count',    label: '个数',     def: 20, min: 1, max: 999 } ],
    situp:  [ { id: 'count',    label: '个数',     def: 20, min: 1, max: 999 } ],
    squat:  [ { id: 'count',    label: '个数',     def: 20, min: 1, max: 999 } ],
  };

  // 组合训练:四个动作的定义 + 默认顺序
  const CIRCUIT_ITEMS = {
    plank:  { name: '平板支撑', kind: 'time',  unit: '秒', def: 60, min: 5, max: 600 },
    pushup: { name: '俯卧撑',   kind: 'count', unit: '个', def: 20, min: 1, max: 999 },
    situp:  { name: '仰卧起坐', kind: 'count', unit: '个', def: 20, min: 1, max: 999 },
    squat:  { name: '深蹲',     kind: 'count', unit: '个', def: 20, min: 1, max: 999 },
  };
  const DEFAULT_ORDER = ['situp', 'plank', 'squat', 'pushup'];
  const CIRCUIT_EXTRA = [
    { id: 'restAction', label: '动作间休息(秒)', def: 15, min: 0, max: 300 },
    { id: 'restRound',  label: '圈间休息(秒)',   def: 60, min: 0, max: 600 },
    { id: 'rounds',     label: '圈数',           def: 3,  min: 1, max: 20 },
  ];

  const PREP_SECONDS = 4;
  const SCALE_SMALL  = 0.45;
  const SCALE_LARGE  = 1.0;

  // ===== 元素 =====
  const menuView   = document.getElementById('menu');
  const setupView  = document.getElementById('setup');
  const activeView = document.getElementById('active');
  const menuList   = document.getElementById('menuList');
  const setupTitle = document.getElementById('setupTitle');
  const fieldsWrap = document.getElementById('fields');
  const circle   = document.getElementById('circle');
  const actionEl = document.getElementById('action');
  const countEl  = document.getElementById('count');
  const progress = document.getElementById('progress');
  const activeControls = document.getElementById('activeControls');
  const finishControls = document.getElementById('finishControls');
  const doneBtn  = document.getElementById('doneBtn');
  const stopBtn  = document.getElementById('stopBtn');

  let currentKey = null;
  let currentSettings = {};
  let circuitOrder = DEFAULT_ORDER.slice();   // 组合训练当前顺序(会被编辑)
  let timers = [];
  let running = false;
  let doneAction = null;

  // ===== 语音 =====
  function unlockSpeech() {
    if (!('speechSynthesis' in window)) return;
    const warmup = new SpeechSynthesisUtterance(' ');
    warmup.volume = 0;
    speechSynthesis.speak(warmup);
  }
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 1; u.volume = 1;
    speechSynthesis.speak(u);
  }

  // ===== 定时器工具 =====
  function later(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); return id; }
  function clearAllTimers() {
    timers.forEach(clearTimeout); timers = [];
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }
  function countdown(seconds, onTick) {
    onTick(seconds);
    for (let i = 1; i <= seconds; i++) later(() => onTick(seconds - i), i * 1000);
  }
  function setCircle(scale, durationSec, rest) {
    circle.classList.toggle('rest', !!rest);
    circle.style.transition = `transform ${durationSec}s linear`;
    void circle.offsetWidth;
    circle.style.transform = `scale(${scale})`;
  }

  // ===== 存取 =====
  function loadVal(key, id, def) {
    const v = localStorage.getItem(`bt_${key}_${id}`);
    return v === null ? def : parseInt(v, 10);
  }
  function saveVal(key, id, val) { localStorage.setItem(`bt_${key}_${id}`, val); }
  function loadOrder() {
    try {
      const v = JSON.parse(localStorage.getItem('bt_circuit_order'));
      // 校验:必须是包含全部四个动作的数组
      if (Array.isArray(v) && v.length === DEFAULT_ORDER.length &&
          DEFAULT_ORDER.every(k => v.includes(k))) return v;
    } catch (e) {}
    return DEFAULT_ORDER.slice();
  }
  function saveOrder(order) { localStorage.setItem('bt_circuit_order', JSON.stringify(order)); }

  // ===== 视图切换 =====
  function show(view) {
    [menuView, setupView, activeView].forEach(v => v.classList.add('hidden'));
    view.classList.remove('hidden');
  }
  function showMenu() { running = false; clearAllTimers(); show(menuView); }

  // ===== 构建主菜单 =====
  Object.keys(EXERCISES).forEach(key => {
    const ex = EXERCISES[key];
    const btn = document.createElement('button');
    btn.className = 'menu-item' + (ex.highlight ? ' highlight' : '');
    btn.innerHTML = `<span class="emoji">${ex.emoji}</span><span>${ex.name}</span>`;
    btn.onclick = () => openSetup(key);
    menuList.appendChild(btn);
  });

  // ===== 通用数字行 =====
  function makeNumberRow(label, id, saved, min, max) {
    const row = document.createElement('div');
    row.className = 'field';
    row.innerHTML = `
      <label>${label}</label>
      <div class="stepper">
        <button data-act="dec">−</button>
        <input type="number" id="fld_${id}" min="${min}" max="${max}" value="${saved}">
        <button data-act="inc">+</button>
      </div>`;
    const input = row.querySelector('input');
    const clamp = () => {
      let v = parseInt(input.value, 10);
      if (isNaN(v) || v < min) v = min;
      if (v > max) v = max;
      input.value = v; return v;
    };
    row.querySelector('[data-act="dec"]').onclick = () => { input.value = clamp() - 1; clamp(); };
    row.querySelector('[data-act="inc"]').onclick = () => { input.value = clamp() + 1; clamp(); };
    input.onchange = clamp;
    return row;
  }

  // ===== 打开设置页 =====
  function openSetup(key) {
    currentKey = key;
    setupTitle.textContent = EXERCISES[key].name;
    fieldsWrap.innerHTML = '';
    if (key === 'circuit') { renderCircuitSetup(); }
    else {
      FIELDS[key].forEach(f => {
        fieldsWrap.appendChild(makeNumberRow(f.label, f.id, loadVal(key, f.id, f.def), f.min, f.max));
      });
    }
    show(setupView);
  }

  // ===== 组合训练设置页(可排序) =====
  function renderCircuitSetup() {
    fieldsWrap.innerHTML = '';
    circuitOrder = loadOrder();

    // 顶部提示
    const hint = document.createElement('div');
    hint.className = 'section-label';
    hint.textContent = '训练顺序(用 ↑↓ 调整)';
    fieldsWrap.appendChild(hint);

    // 记录每个动作输入框的临时值,重排时保留
    circuitOrder.forEach((exKey, idx) => {
      const item = CIRCUIT_ITEMS[exKey];
      const saved = loadVal('circuit', exKey, item.def);
      const row = document.createElement('div');
      row.className = 'ex-row';
      row.innerHTML = `
        <div class="ex-order">
          <button data-act="up" ${idx === 0 ? 'disabled' : ''}>▲</button>
          <button data-act="down" ${idx === circuitOrder.length - 1 ? 'disabled' : ''}>▼</button>
        </div>
        <span class="ex-idx">${idx + 1}</span>
        <span class="ex-name">${item.name}</span>
        <div class="stepper">
          <button data-act="dec">−</button>
          <input type="number" id="cir_${exKey}" min="${item.min}" max="${item.max}" value="${saved}">
          <button data-act="inc">+</button>
          <span class="unit">${item.unit}</span>
        </div>`;
      const input = row.querySelector('input');
      const clamp = () => {
        let v = parseInt(input.value, 10);
        if (isNaN(v) || v < item.min) v = item.min;
        if (v > item.max) v = item.max;
        input.value = v; return v;
      };
      row.querySelector('[data-act="dec"]').onclick = () => { input.value = clamp() - 1; clamp(); };
      row.querySelector('[data-act="inc"]').onclick = () => { input.value = clamp() + 1; clamp(); };
      input.onchange = clamp;
      row.querySelector('[data-act="up"]').onclick   = () => moveCircuit(idx, -1);
      row.querySelector('[data-act="down"]').onclick = () => moveCircuit(idx, +1);
      fieldsWrap.appendChild(row);
    });

    // 休息 / 圈数
    const extraLabel = document.createElement('div');
    extraLabel.className = 'section-label';
    extraLabel.textContent = '休息与圈数';
    fieldsWrap.appendChild(extraLabel);
    CIRCUIT_EXTRA.forEach(f => {
      fieldsWrap.appendChild(makeNumberRow(f.label, f.id, loadVal('circuit', f.id, f.def), f.min, f.max));
    });
  }

  // 重排:先把当前输入框的值存下来,交换顺序,再重绘
  function moveCircuit(idx, dir) {
    // 保存当前所有动作数量
    circuitOrder.forEach(exKey => {
      const input = document.getElementById(`cir_${exKey}`);
      if (input) saveVal('circuit', exKey, parseInt(input.value, 10) || CIRCUIT_ITEMS[exKey].def);
    });
    // 保存休息/圈数
    CIRCUIT_EXTRA.forEach(f => {
      const input = document.getElementById(`fld_${f.id}`);
      if (input) saveVal('circuit', f.id, parseInt(input.value, 10) || f.def);
    });
    const j = idx + dir;
    if (j < 0 || j >= circuitOrder.length) return;
    [circuitOrder[idx], circuitOrder[j]] = [circuitOrder[j], circuitOrder[idx]];
    saveOrder(circuitOrder);
    renderCircuitSetup();
  }

  // ===== 从设置页开始 =====
  function beginFromSetup() {
    unlockSpeech();
    currentSettings = {};
    if (currentKey === 'circuit') {
      circuitOrder.forEach(exKey => {
        const input = document.getElementById(`cir_${exKey}`);
        const item = CIRCUIT_ITEMS[exKey];
        let v = parseInt(input.value, 10);
        if (isNaN(v) || v < item.min) v = item.min;
        if (v > item.max) v = item.max;
        currentSettings[exKey] = v;
        saveVal('circuit', exKey, v);
      });
      CIRCUIT_EXTRA.forEach(f => {
        const input = document.getElementById(`fld_${f.id}`);
        let v = parseInt(input.value, 10);
        if (isNaN(v) || v < f.min) v = f.min;
        if (v > f.max) v = f.max;
        currentSettings[f.id] = v;
        saveVal('circuit', f.id, v);
      });
      saveOrder(circuitOrder);
    } else {
      FIELDS[currentKey].forEach(f => {
        const input = document.getElementById(`fld_${f.id}`);
        let v = parseInt(input.value, 10);
        if (isNaN(v) || v < f.min) v = f.min;
        if (v > f.max) v = f.max;
        currentSettings[f.id] = v;
        saveVal(currentKey, f.id, v);
      });
    }
    startCurrent();
  }

  // ===== 进入运行页 =====
  function startCurrent() {
    const type = EXERCISES[currentKey].type;
    running = true;
    show(activeView);
    finishControls.classList.add('hidden');
    activeControls.classList.remove('hidden');
    doneBtn.classList.add('hidden');
    doneAction = null;
    stopBtn.textContent = (type === 'count') ? '返回' : '停止';

    if (type === 'breathing') runBreathing(currentSettings);
    else if (type === 'time') runTime(currentSettings);
    else if (type === 'count') runCount(currentSettings);
    else if (type === 'circuit') runCircuit(currentSettings);
  }

  // ===== 呼吸训练(每组 N 次 × M 组 + 组间休息) =====
  function runBreathing(s) {
    actionEl.textContent = '准备';
    setCircle((SCALE_SMALL + SCALE_LARGE) / 2, 0.3);
    progress.textContent = `呼吸训练 · 共 ${s.sets} 组`;
    countdown(PREP_SECONDS, n => { countEl.textContent = n > 0 ? n : ''; });
    later(() => runBreathRep(1, 1, s), PREP_SECONDS * 1000);
  }
  // 第 set 组的第 rep 次呼吸
  function runBreathRep(set, rep, s) {
    if (!running) return;
    progress.textContent = `第 ${set}/${s.sets} 组 · 第 ${rep}/${s.reps} 次`;
    // 收缩
    speak('收缩');
    actionEl.textContent = '收缩';
    setCircle(SCALE_SMALL, s.contract, false);
    countdown(s.contract, n => { countEl.textContent = n > 0 ? n : ''; });
    // 放开
    later(() => {
      if (!running) return;
      speak('放开');
      actionEl.textContent = '放开';
      setCircle(SCALE_LARGE, s.release, false);
      countdown(s.release, n => { countEl.textContent = n > 0 ? n : ''; });
    }, s.contract * 1000);
    // 本次结束 → 下一次 / 组间休息 / 完成
    later(() => {
      if (!running) return;
      if (rep < s.reps) {
        runBreathRep(set, rep + 1, s);
      } else if (set < s.sets) {
        restBetween(set, s);
      } else {
        finish();
      }
    }, (s.contract + s.release) * 1000);
  }
  // 组间休息,结束后进入下一组
  function restBetween(set, s) {
    if (s.rest <= 0) { runBreathRep(set + 1, 1, s); return; }
    speak('休息');
    actionEl.textContent = '休息';
    setCircle(0.6, 0.3, true);
    progress.textContent = `休息 · 下一组:第 ${set + 1}/${s.sets} 组`;
    countdown(s.rest, n => { countEl.textContent = n > 0 ? n : ''; });
    later(() => { if (running) runBreathRep(set + 1, 1, s); }, s.rest * 1000);
  }

  // ===== 平板支撑(单项) =====
  function runTime(s) {
    actionEl.textContent = '准备';
    setCircle(0.7, 0.3);
    progress.textContent = `平板支撑 · ${s.duration} 秒`;
    countdown(PREP_SECONDS, n => { countEl.textContent = n > 0 ? n : ''; });
    later(() => {
      if (!running) return;
      speak('开始');
      actionEl.textContent = '坚持';
      setCircle(0.85, 0.3);
      countdown(s.duration, n => { countEl.textContent = n > 0 ? n : ''; });
    }, PREP_SECONDS * 1000);
    later(() => { if (running) finish(); }, (PREP_SECONDS + s.duration) * 1000);
  }

  // ===== 计次训练(单项) =====
  function runCount(s) {
    speak('开始');
    progress.textContent = EXERCISES[currentKey].name;
    setCircle(0.85, 0.3);
    actionEl.textContent = '目标';
    countEl.textContent = `${s.count} 个`;
    doneBtn.textContent = '完成';
    doneBtn.classList.remove('hidden');
    doneAction = finish;
  }

  // ===== 组合训练 =====
  function runCircuit(s) {
    const plan = [];
    const order = circuitOrder;
    for (let r = 1; r <= s.rounds; r++) {
      order.forEach((exKey, i) => {
        const item = CIRCUIT_ITEMS[exKey];
        plan.push({ type: 'exercise', kind: item.kind, amount: s[exKey], name: item.name, round: r });
        if (i < order.length - 1) {
          if (s.restAction > 0) plan.push({ type: 'rest', secs: s.restAction, nextName: CIRCUIT_ITEMS[order[i + 1]].name });
        } else if (r < s.rounds && s.restRound > 0) {
          plan.push({ type: 'rest', secs: s.restRound, nextName: `第 ${r + 1} 圈 · ${CIRCUIT_ITEMS[order[0]].name}` });
        }
      });
    }
    actionEl.textContent = '准备';
    setCircle(0.7, 0.3);
    progress.textContent = `组合训练 · 共 ${s.rounds} 圈`;
    countdown(PREP_SECONDS, n => { countEl.textContent = n > 0 ? n : ''; });
    later(() => runCircuitStep(plan, 0, s), PREP_SECONDS * 1000);
  }

  function runCircuitStep(plan, i, s) {
    if (!running) return;
    if (i >= plan.length) { finish(); return; }
    const item = plan[i];

    if (item.type === 'rest') {
      doneBtn.classList.add('hidden');
      doneAction = null;
      speak('休息');
      actionEl.textContent = '休息';
      setCircle(0.6, 0.3, true);
      progress.textContent = `休息 · 下一个:${item.nextName}`;
      countdown(item.secs, n => { countEl.textContent = n > 0 ? n : ''; });
      later(() => runCircuitStep(plan, i + 1, s), item.secs * 1000);
      return;
    }

    progress.textContent = `第 ${item.round}/${s.rounds} 圈 · ${item.name}`;
    if (item.kind === 'time') {
      doneBtn.classList.add('hidden');
      doneAction = null;
      speak(item.name);
      actionEl.textContent = item.name;
      setCircle(0.85, 0.3, false);
      countdown(item.amount, n => { countEl.textContent = n > 0 ? n : ''; });
      later(() => runCircuitStep(plan, i + 1, s), item.amount * 1000);
    } else {
      speak(item.name);
      actionEl.textContent = item.name;
      setCircle(0.85, 0.3, false);
      countEl.textContent = `${item.amount} 个`;
      doneBtn.textContent = '下一个 ›';
      doneBtn.classList.remove('hidden');
      doneAction = () => runCircuitStep(plan, i + 1, s);
    }
  }

  // ===== 结束 =====
  function finish() {
    running = false; clearAllTimers();
    speak('完成');
    actionEl.textContent = '完成!';
    countEl.textContent = '🎉';
    progress.textContent = '做得好,休息一下';
    setCircle((SCALE_SMALL + SCALE_LARGE) / 2, 0.5, false);
    activeControls.classList.add('hidden');
    finishControls.classList.remove('hidden');
    doneAction = null;
  }

  // ===== 按钮绑定 =====
  document.getElementById('setupBack').onclick = showMenu;
  document.getElementById('startBtn').onclick  = beginFromSetup;
  doneBtn.onclick = () => { if (doneAction) doneAction(); };
  stopBtn.onclick = () => { running = false; clearAllTimers(); openSetup(currentKey); };
  document.getElementById('againBtn').onclick = startCurrent;
  document.getElementById('menuBtn').onclick  = showMenu;

  showMenu();
</script>
</body>
